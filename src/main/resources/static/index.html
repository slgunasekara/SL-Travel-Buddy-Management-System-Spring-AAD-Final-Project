<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SL Travel Buddy — Login</title>
    <link rel="stylesheet" href="css/style.css"/>
    <link rel="icon" type="image/png" href="assets/SLTravelBuddy.png">
    <script>(function () {
        try {
            document.documentElement.setAttribute('data-theme', localStorage.getItem('bms_theme') || 'light');
        } catch (e) {
        }
    })();</script>
</head>
<body class="auth-body">
<div class="auth-bg-particle auth-bg-particle--1"></div>
<div class="auth-bg-particle auth-bg-particle--2"></div>
<div class="auth-bg-particle auth-bg-particle--3"></div>

<div class="auth-shell">
    <div class="auth-visual">
        <div class="auth-visual__overlay">
            <img src="assets/login-logo.png" alt="SL Travel Buddy Logo" class="auth-visual__logo">
            <h1>SL Travel Buddy</h1>
            <p>Fleet Management System</p>
        </div>
        <div class="auth-visual__footer">© <span id="authYear"></span> SL Travel Buddy · All Rights Reserved</div>
    </div>

    <div class="auth-panel">
        <div class="auth-card" id="loginCard">
            <div class="auth-greeting" id="authGreeting"></div>
            <h2>Login to Your Account</h2>
            <p class="muted">Enter your credentials to continue</p>

            <form id="loginForm" novalidate>
                <div class="form-field">
                    <label for="username">Username</label>
                    <div class="input-icon-wrap">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7"
                                                                                                          r="4"/></svg>
              </span>
                        <input type="text" id="username" autocomplete="username" required
                               placeholder="Enter your username"/>
                    </div>
                </div>
                <div class="form-field">
                    <label for="password">Password</label>
                    <div class="input-icon-wrap password-wrap">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path
                        d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
                        <input type="password" id="password" autocomplete="current-password" required
                               placeholder="••••••••"/>
                        <button type="button" class="password-toggle" id="togglePw" aria-label="Show password">👁
                        </button>
                    </div>
                </div>
                <div id="loginError" class="form-error" hidden></div>

                <div class="auth-options">
                    <label class="auth-remember">
                        <input type="checkbox" id="rememberMe"/> Remember me
                    </label>
                    <button type="button" class="link-btn" id="linkForgot">Forgot password?</button>
                </div>

                <button type="submit" class="btn btn--auth-submit btn--block" id="btnLogin">
                    <svg class="btn--auth-submit__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 2 11 13"/>
                        <path d="M22 2 15 22l-4-9-9-4 20-7Z"/>
                    </svg>
                    <span>Login to Dashboard</span>
                </button>
            </form>

            <div class="auth-card__footer">© <span id="authYear2"></span> SL Travel Buddy · All Rights Reserved</div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script>
    if (Session.isLoggedIn()) location.href = "dashboard.html";

    // Footer copyright years
    const yearNow = new Date().getFullYear();
    qs("#authYear").textContent = yearNow;
    qs("#authYear2").textContent = yearNow;


    (function setGreeting() {
        const hour = new Date().getHours();
        let text;
        if (hour >= 5 && hour < 12) text = "Good Morning!";
        else if (hour >= 12 && hour < 17) text = "Good Afternoon!";
        else if (hour >= 17 && hour < 21) text = "Good Evening!";
        else text = "Good Night!";
        qs("#authGreeting").textContent = text;
    })();


    const REMEMBER_KEY = "bms_remembered_username";
    (function restoreRememberedUsername() {
        const saved = localStorage.getItem(REMEMBER_KEY);
        if (saved) {
            qs("#username").value = saved;
            qs("#rememberMe").checked = true;
        }
    })();

    const form = qs("#loginForm");
    const errBox = qs("#loginError");

    qs("#togglePw").addEventListener("click", () => {
        const pw = qs("#password");
        pw.type = pw.type === "password" ? "text" : "password";
    });

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errBox.hidden = true;
        const username = qs("#username").value.trim();
        const password = qs("#password").value;
        if (!username || !password) {
            errBox.textContent = "Please enter both username and password.";
            errBox.hidden = false;
            return;
        }
        const btn = qs("#btnLogin");
        btn.disabled = true;
        const result = await Auth.authenticate(username, password);
        btn.disabled = false;
        if (!result.ok) {
            errBox.textContent = result.message;
            errBox.hidden = false;
            return;
        }
        if (qs("#rememberMe").checked) localStorage.setItem(REMEMBER_KEY, username);
        else localStorage.removeItem(REMEMBER_KEY);
        Session.set(result.user, result.token);
        Toast.success(`Welcome, ${result.user.name}!`);
        setTimeout(() => location.href = "dashboard.html", 400);
    });

    /* ---------------- Forgot password / OTP flow ---------------- */
    qs("#linkForgot").addEventListener("click", () => {
        let stage = "email";
        let pendingEmail = "";
        let pendingUserId = null;
        let pendingCode = "";

        function bodyForStage() {
            if (stage === "email") {
                return `
            <p class="muted">Enter the email address linked to your account. We'll send a one-time code to it.</p>
            <div class="form-field"><label>Email</label><input type="email" id="fpEmail" placeholder="you@example.com" /></div>`;
            }
            if (stage === "otp") {
                return `
            <div class="otp-banner otp-banner--sent">
              <strong>✓ Code sent!</strong> We emailed a 6-digit verification code to <strong>${Fmt.escapeHtml(pendingEmail)}</strong>.
              <span class="muted">Check your inbox (and spam folder). Valid for 10 minutes.</span>
            </div>
            <div class="form-field"><label>Enter the 6-digit code</label><input type="text" id="fpOtp" maxlength="6" placeholder="000000" /></div>`;
            }
            return `
          <div class="form-field"><label>New Password</label><input type="password" id="fpNewPw" placeholder="At least 6 characters" /></div>
          <div class="form-field"><label>Confirm Password</label><input type="password" id="fpConfirmPw" placeholder="Re-enter password" /></div>`;
        }

        const modal = openModal({
            title: "Reset Password",
            bodyHtml: `<div id="fpBody">${bodyForStage()}</div>`,
            footerHtml: `<button class="btn btn--ghost" data-act="x">Cancel</button><button class="btn btn--primary" id="fpNext">Send Code</button>`,
            onMount(overlay) {
                function refresh() {
                    qs("#fpBody", overlay).innerHTML = bodyForStage();
                    qs("#fpNext", overlay).textContent = stage === "email" ? "Send Code" : stage === "otp" ? "Verify Code" : "Reset Password";
                }

                qs("#fpNext", overlay).addEventListener("click", () => handleNext(overlay, refresh));
                refresh();
            }
        });

        async function handleNext(overlay, refresh) {
            if (stage === "email") {
                const email = qs("#fpEmail", overlay).value.trim();
                if (!Validate.isEmail(email)) {
                    Toast.warning("Please enter a valid email address.");
                    return;
                }
                const res = await Auth.requestOtp(email);
                if (!res.ok) {
                    Toast.error("No account found with that email address.");
                    return;
                }

                pendingEmail = email;
                pendingUserId = res.user.userId;

                Toast.success(`Verification code emailed to ${pendingEmail}.`);
                stage = "otp";
                refresh();
            } else if (stage === "otp") {
                const code = qs("#fpOtp", overlay).value.trim();
                const uid = await Auth.verifyOtp(pendingEmail, code);
                if (!uid) {
                    Toast.error("Invalid or expired code. Please try again.");
                    return;
                }
                pendingUserId = uid;
                pendingCode = code;
                Toast.success("Code verified!");
                stage = "reset";
                refresh();
            } else {
                const pw1 = qs("#fpNewPw", overlay).value;
                const pw2 = qs("#fpConfirmPw", overlay).value;
                if (pw1.length < 6) {
                    Toast.warning("Password must be at least 6 characters.");
                    return;
                }
                if (pw1 !== pw2) {
                    Toast.warning("Passwords do not match.");
                    return;
                }
                const ok = await Auth.resetPassword(pendingUserId, pw1, pendingEmail, pendingCode);
                if (!ok) {
                    Toast.error("Could not reset your password. Please try again.");
                    return;
                }
                Toast.success("Password reset successfully! Please sign in.");
                modal.close();
            }
        }
    });
</script>
</body>
</html>
